name: Publish image

# Публикация образа в GitHub Container Registry (ghcr.io).
# Ветка main даёт теги latest, main и sha-<короткий хеш>; git-тег v1.2.3 —
# теги 1.2.3 и 1.2. Авторизация — встроенный GITHUB_TOKEN, отдельный секрет
# с PAT не нужен.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR принимает только строчные имена, а github.repository сохраняет
      # регистр владельца и названия.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Читаем кеш проверки из ci.yml (scope=image), пишем в собственный:
          # два workflow могут идти одновременно, и общий ключ на запись они
          # делили бы с ошибкой.
          cache-from: |
            type=gha,scope=image
            type=gha,scope=image-publish
          cache-to: type=gha,mode=max,scope=image-publish
          provenance: true
          sbom: true